# Deploy together with compose.yml; keeps local development independent of Dokploy.
services:
  backend:
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},unmsm-api-metrics
    networks:
      default:
      dokploy-network:
        aliases:
          - unmsm-api-metrics

networks:
  dokploy-network:
    external: true
