name: Branch flow

on:
  pull_request:
    branches:
      - development
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  branch-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Require development as the source branch for main
        if: github.event.pull_request.base.ref == 'main'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REF" != "development" || "$HEAD_REPO" != "$EXPECTED_REPO" ]]; then
            echo "::error::Pull requests into main must come from development in this repository."
            exit 1
          fi
      - name: Allow integration PRs into development
        if: github.event.pull_request.base.ref == 'development'
        run: echo "Pull request targets development."
